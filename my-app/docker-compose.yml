services:
  # Valkey (Redis Alternative)
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: valkey_server
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: always

# Comment this out until you actually create a Dockerfile
# bullmq-app:
#   build: .
#   container_name: bullmq_service
#   ...

volumes:
  valkey_data: